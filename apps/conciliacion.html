<style>
  /* ===== Tokens: misma paleta sobria de la suite ===== */
  :root {
    --chrome: #f3f4f6;
    --chrome-2: #e8eaee;
    --line: #d5d8de;
    --bg: #eef0f3;
    --surface: #ffffff;
    --ink: #1f2328;
    --ink-2: #5a6270;
    --ink-3: #8a919c;
    --accent: #466b8c;
    --accent-soft: #e3ebf2;
    --ok: #2d6140;   --ok-bg: #e2efe6;
    --bad: #a3372a;  --bad-bg: #f7e3df;
    --wait: #50575f; --wait-bg: #eceef1;
    --banco: #3a6690;   --banco-bg: #e1eaf3;     /* tarjetas del extracto bancario */
    --conta: #7a5a2e;   --conta-bg: #f3ebdc;     /* tarjetas de contabilidad */
    --font: Calibri, "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.35 var(--font); overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100%; min-width: 0; }

  /* ===== Barra de título ===== */
  .titlebar { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--accent); color: #fff; white-space: nowrap; overflow: hidden; }
  .launcher { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 3px; color: #fff; flex: none; }
  .launcher:hover { background: rgba(255,255,255,.15); }
  .launcher:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
  .launcher svg { width: 14px; height: 14px; fill: currentColor; }
  .titlebar .doc { font-weight: 600; }
  .titlebar .sub { opacity: .8; font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .titlebar .spacer { flex: 1; }
  .titlebar .user { width: 22px; height: 22px; border-radius: 50%; background: #dfe7ee; color: var(--accent); display: grid; place-items: center; font-size: 10px; font-weight: 700; flex: none; }

  /* ===== Barra de herramientas ===== */
  .toolbar { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--chrome); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
  .toolbar::-webkit-scrollbar { display: none; }
  .btn {
    flex: none; height: 30px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 3px; background: #fff; color: var(--ink); font: inherit; cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: var(--accent-soft); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #3d5f7e; }
  .sep { flex: none; width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  .combo { flex: none; height: 28px; padding: 0 8px; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: #fff; border-radius: 3px; color: var(--ink-2); }
  .combo::after { content: "▾"; font-size: 10px; color: var(--ink-3); margin-left: 4px; }
  .combo b { color: var(--ink); font-weight: 600; }
  .buscar { flex: none; margin-left: auto; height: 28px; width: 200px; padding: 0 8px; border: 1px solid var(--line); border-radius: 3px; font: inherit; background: #fff; color: var(--ink); }

  /* ===== Pestañas de vista ===== */
  .views { display: flex; gap: 2px; padding: 0 12px; background: #fff; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .views::-webkit-scrollbar { display: none; }
  .view-tab { flex: none; padding: 8px 12px; border: 0; background: transparent; color: var(--ink-2); font: inherit; cursor: pointer; }
  .view-tab[aria-selected="true"] { color: var(--accent); font-weight: 700; box-shadow: inset 0 -2px 0 var(--accent); }
  .view-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ===== Contenido ===== */
  .main { flex: 1; min-height: 0; overflow: auto; }
  .page { padding: 16px 16px 32px; max-width: 1180px; }
  .page h2 { margin: 0; font-size: 18px; }
  .muted { color: var(--ink-3); font-size: 12px; margin: 2px 0 0; }
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: transparent; font: inherit; padding: 5px 11px; cursor: pointer; color: var(--ink-2); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 700; }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .lote { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lote .lbl { font-size: 12px; color: var(--ink-2); }

  /* Resumen superior (tiras de KPI) */
  .resumen { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
  .kpi .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 12px; color: var(--ink-3); }
  .meter { height: 6px; background: #e6e8ec; border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: var(--ok); border-radius: 3px; }

  /* ===== Rejilla de documentos (el tablero) ===== */
  .rejilla { display: grid; gap: 8px; grid-template-columns: repeat(var(--cols), minmax(0, 150px)); }
  .doc {
    position: relative; height: 86px; padding: 7px 9px; border-radius: 5px; border: 1px solid var(--line);
    background: #fff; text-align: left; font: inherit; color: var(--ink); cursor: pointer;
    display: flex; flex-direction: column; gap: 3px; overflow: hidden; min-width: 0;
  }
  .doc:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Documento sin revisar: cara oculta con aspecto de registro pendiente */
  .doc.oculta {
    background: #f7f8fa repeating-linear-gradient(135deg, transparent 0 7px, rgba(138,145,156,.08) 7px 14px);
    color: var(--ink-3);
  }
  .doc.oculta:hover { border-color: #b9c4d0; background-color: #fff; }
  .doc .ref { font-size: 11px; font-variant-numeric: tabular-nums; }
  .doc .pend { margin-top: auto; font-size: 12px; }
  .doc .top { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .tag { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 10px; font-weight: 700; letter-spacing: .04em; line-height: 15px; text-transform: uppercase; white-space: nowrap; }
  .tag.b { background: var(--banco-bg); color: var(--banco); }
  .tag.c { background: var(--conta-bg); color: var(--conta); }
  .doc .fecha { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .doc .concepto { font-size: 12px; color: var(--ink-2); line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .doc .imp { margin-top: auto; text-align: right; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
  .imp.pos { color: var(--ok); }
  .doc.vista { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .doc.ok { background: #f3f8f4; border-color: #cfe3d5; cursor: default; }
  .doc.ok .concepto, .doc.ok .imp { opacity: .75; }
  .doc.ok::after {
    content: "✓"; position: absolute; left: 8px; bottom: 6px; font-size: 12px; font-weight: 700; color: var(--ok);
  }
  .doc.fallo { border-color: #c0473a; box-shadow: 0 0 0 1px #c0473a; }

  /* Estado (sello) */
  .estado { display: inline-block; padding: 2px 10px; border-radius: 4px; border: 1.5px solid currentColor; font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .estado.ok { color: var(--ok); background: var(--ok-bg); }
  .estado.run { color: var(--accent); background: var(--accent-soft); }

  /* Tablas de extracto y guía */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; min-width: 0; }
  .tablewrap { overflow-x: auto; }
  table.list { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .list th, .list td { padding: 6px 8px; border-bottom: 1px solid #e6e8ec; text-align: left; white-space: nowrap; }
  .list th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 700; }
  .list td.n, .list th.n { text-align: right; }
  .list td.wrap { white-space: normal; min-width: 260px; }
  .list .pos { color: var(--ok); }

  /* ===== Barra de estado ===== */
  .status { display: flex; align-items: center; gap: 18px; padding: 3px 12px; padding-bottom: calc(3px + env(safe-area-inset-bottom, 0px)); background: var(--chrome); border-top: 1px solid var(--line); color: var(--ink-2); font-size: 12px; white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
  .status .spacer { flex: 1; }
  #btnIdioma { border: 0; background: transparent; color: inherit; font: inherit; padding: 1px 4px; border-radius: 2px; cursor: pointer; }
  #btnIdioma:hover { background: var(--chrome-2); }
  #btnIdioma:focus-visible { outline: 2px solid var(--accent); }

  .toast { position: fixed; right: 16px; bottom: 44px; max-width: calc(100% - 32px); z-index: 60; background: #fff; color: var(--ink); border: 1px solid var(--line); border-left: 3px solid var(--ok); box-shadow: 0 2px 8px rgba(20, 30, 45, .15); padding: 8px 12px; }

  @media (max-width: 700px) {
    .rejilla { grid-template-columns: repeat(var(--cols-m), minmax(0, 1fr)); gap: 6px; }
    .doc { height: 74px; padding: 5px 6px; }
    .doc .concepto, .doc .fecha { display: none; }
    .doc .imp { font-size: 12px; }
    .tag { font-size: 9px; padding: 0 4px; }
    .resumen { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .resumen .kpi:last-child { display: none; }
  }
  @media (max-width: 560px) {
    .titlebar .sub, .combo, .buscar, .toolbar .sep { display: none; }
    .status { gap: 10px; }
    .status .opt { display: none; }
  }
</style>
</head>

   ===================================================================== */
function barajar(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function nuevoLote(lote) {
  const { parejas } = LOTES[lote];
  const elegidos = barajar(MOVIMIENTOS.map((_, i) => i)).slice(0, parejas);
  const docs = [];
  elegidos.forEach((par, k) => {
    const dia = 1 + Math.floor(Math.random() * 17);
    docs.push({ par, tipo: "b", estado: "oculta", dia, ref: `${(7710 + par * 37) % 10000}`.padStart(4, "0") });
    docs.push({ par, tipo: "c", estado: "oculta", dia, ref: String(4100 + k * 7 + par) });
  });
  return { lote, docs: barajar(docs), abiertos: [], revisiones: 0, conciliados: 0, parejas, cerrado: false };
}

// Revela un documento. Devuelve "nada" | "uno" | "acierto" | "fallo"
function revelar(j, i) {
  const d = j.docs[i];
  if (j.cerrado || d.estado !== "oculta") return "nada";
  if (j.abiertos.length === 2) ocultarAbiertos(j);     // un tercer clic tapa al instante la pareja fallida
  d.estado = "vista";
  j.abiertos.push(i);
  if (j.abiertos.length < 2) return "uno";
  j.revisiones++;
  const [a, b] = j.abiertos.map(k => j.docs[k]);
  if (a.par === b.par) {
    a.estado = b.estado = "ok";
    j.abiertos = []; j.conciliados++;
    if (j.conciliados === j.parejas) j.cerrado = true;
    return "acierto";
  }
  return "fallo";
}

function ocultarAbiertos(j) {
  j.abiertos.forEach(k => { if (j.docs[k].estado === "vista") j.docs[k].estado = "oculta"; });
  j.abiertos = [];
}

const importePendiente = j => {
  const vistos = new Set();
  let s = 0;
  for (const d of j.docs) if (d.estado !== "ok" && !vistos.has(d.par)) { vistos.add(d.par); s += Math.abs(MOVIMIENTOS[d.par][4]); }
  return s;
};

/* ===== Cronómetro por tramos ===== */
const crono = { ms: 0, inicio: 0, activo: false };
function arrancar() { if (crono.activo && !crono.inicio) crono.inicio = performance.now(); }
function parar() { if (crono.inicio) { crono.ms += performance.now() - crono.inicio; crono.inicio = 0; } }
function transcurrido() { return crono.ms + (crono.inicio ? performance.now() - crono.inicio : 0); }
function reiniciarCrono() { crono.ms = 0; crono.inicio = 0; crono.activo = false; }

/* =====================================================================
   RENDERIZADO Y ACCIONES
   ===================================================================== */
const $ = id => document.getElementById(id);
let idioma = "es", T = TEXTOS.es, vista = "conciliar";
let juego = nuevoLote("diario");
let temporizadorFallo = 0;

const eur = v => formatoEuros(v, T.locale);
const fechaDoc = dia => `${String(dia).padStart(2, "0")}/10`;
function concepto(d) {
  const m = MOVIMIENTOS[d.par];
  return idioma === "es" ? (d.tipo === "b" ? m[0] : m[1]) : (d.tipo === "b" ? m[2] : m[3]);
}

function htmlDoc(d, i) {
  if (d.estado === "oculta") {
    return `<button class="doc oculta" type="button" data-i="${i}" aria-label="${T.pendiente}">
      <span class="ref">#${String(i + 1).padStart(3, "0")}</span><span class="pend">${T.pendiente}</span></button>`;
  }
  const imp = MOVIMIENTOS[d.par][4];
  const etiqueta = d.tipo === "b" ? `<span class="tag b">${T.banco}</span>` : `<span class="tag c">${T.conta} ${d.ref}</span>`;
  const fallo = juego.abiertos.length === 2 && juego.abiertos.includes(i) && d.estado === "vista" ? " fallo" : "";
  return `<button class="doc ${d.estado}${fallo}" type="button" data-i="${i}" ${d.estado === "ok" ? 'aria-disabled="true"' : ""}>
    <span class="top">${etiqueta}<span class="fecha">${fechaDoc(d.dia)}</span></span>
    <span class="concepto">${concepto(d)}</span>
    <span class="imp ${imp > 0 ? "pos" : ""}">${eur(imp)}</span></button>`;
}

function render() {
  const j = juego, L = LOTES[j.lote];
  const pct = j.conciliados / j.parejas * 100;
  const estado = j.cerrado ? `<span class="estado ok">${T.estados.ok}</span>` : `<span class="estado run">${T.estados.curso}</span>`;
  $("vConciliar").innerHTML = `
    <div class="head"><div><h2>${T.titulo}</h2><p class="muted">${T.subtitulo}</p></div>
      <div class="lote"><span class="lbl">${T.lote}</span><span class="seg" role="group" aria-label="${T.lote}">${Object.keys(LOTES).map(k =>
        `<button type="button" data-lote="${k}" aria-pressed="${k === j.lote}">${T.lotes[k]}</button>`).join("")}</span>${estado}</div></div>
    <div class="resumen">
      <div class="kpi"><div class="v">${eur(importePendiente(j))}</div><div class="l">${T.kpis[0]}</div></div>
      <div class="kpi"><div class="v">${j.conciliados} / ${j.parejas}</div><div class="l">${T.kpis[1]}</div><div class="meter"><span style="width:${pct}%"></span></div></div>
      <div class="kpi"><div class="v">${j.revisiones}</div><div class="l">${T.kpis[2]}</div></div>
    </div>
    <div class="rejilla" style="--cols:${L.cols};--cols-m:${L.colsM}">${j.docs.map(htmlDoc).join("")}</div>`;
  pintarEstado();
}

function pintarEstado() {
  $("stConciliados").textContent = T.conciliados(juego.conciliados, juego.parejas);
  $("stIntentos").textContent = T.intentos(juego.revisiones);
  const s = Math.floor(transcurrido() / 1000);
  $("stTiempo").textContent = T.tiempo + String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}

let temporizadorToast = 0;
function toast(texto) {
  $("toast").textContent = texto; $("toast").hidden = false;
  clearTimeout(temporizadorToast);
  temporizadorToast = setTimeout(() => { $("toast").hidden = true; }, DURACION_TOAST);
}

function clicDocumento(i) {
  clearTimeout(temporizadorFallo);
  const r = revelar(juego, i);
  if (r === "nada") return;
  if (!crono.activo) { crono.activo = true; arrancar(); }
  render();
  if (r === "fallo") temporizadorFallo = setTimeout(() => { ocultarAbiertos(juego); render(); }, PAUSA_FALLO_MS);
  if (juego.cerrado) { parar(); crono.activo = false; pintarEstado(); toast(T.victoria); }
  // Mantiene el foco en el documento pulsado (útil con teclado)
  $("vConciliar").querySelector(`.doc[data-i="${i}"]`)?.focus({ preventScroll: true });
}

function empezarLote(lote) {
  clearTimeout(temporizadorFallo);
  juego = nuevoLote(lote);
  reiniciarCrono();
  $("toast").hidden = true;
  render();
}

/* ===== Vistas seguras ===== */
function construirExtracto() {
  const E = T.extracto;
  // Extracto ordenado por fecha con todos los movimientos del mes y saldo acumulado
  const filas = MOVIMIENTOS.map((m, i) => ({ dia: 1 + (i * 7) % 17, i, m })).sort((a, b) => a.dia - b.dia || a.i - b.i);
  let saldo = SALDO_INICIAL;
  const html = filas.map(({ dia, i, m }) => {
    saldo += m[4];
    return `<tr><td>${fechaDoc(dia)}/2026</td><td>${idioma === "es" ? m[0] : m[2]}</td><td>${String((7710 + i * 37) % 10000).padStart(4, "0")}</td>
      <td class="n ${m[4] > 0 ? "pos" : ""}">${eur(m[4])}</td><td class="n">${eur(saldo)}</td></tr>`;
  }).join("");
  $("vExtracto").innerHTML = `<h2>${E.titulo}</h2><p class="muted">${E.sub}</p>
    <div class="resumen" style="margin-top:14px">
      <div class="kpi"><div class="v">${eur(SALDO_INICIAL)}</div><div class="l">${E.kpis[0]}</div></div>
      <div class="kpi"><div class="v">${eur(saldo)}</div><div class="l">${E.kpis[1]}</div></div>
      <div class="kpi"><div class="v">${MOVIMIENTOS.length}</div><div class="l">${E.kpis[2]}</div></div>
    </div>
    <section class="panel"><div class="tablewrap"><table class="list">
      <thead><tr>${E.cab.map((c, k) => `<th class="${k >= 3 ? "n" : ""}">${c}</th>`).join("")}</tr></thead><tbody>${html}</tbody>
    </table></div></section>`;
}

function construirGuia() {
  const G = T.guia;
  $("vGuia").innerHTML = `<h2>${G.titulo}</h2><p class="muted">${G.sub}</p>
    <section class="panel" style="margin-top:14px"><div class="tablewrap"><table class="list">
      <thead><tr>${G.cab.map(c => `<th>${c}</th>`).join("")}</tr></thead>
      <tbody>${G.filas.map(f => `<tr><td><b>${f[0]}</b></td><td>${f[1]}</td><td class="wrap">${f[2]}</td></tr>`).join("")}</tbody>
    </table></div></section>`;
}

function mostrarVista(v) {
  if (v === vista) return;
  if (vista === "conciliar") parar();
  vista = v;
  $("vConciliar").hidden = v !== "conciliar";
  $("vExtracto").hidden = v !== "extracto";
  $("vGuia").hidden = v !== "guia";
  $("toast").hidden = true;
  $("main").scrollTo(0, 0);
  if (v === "conciliar" && crono.activo) arrancar();
  document.querySelectorAll(".view-tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.vista === v)));
  pintarEstado();
}

/* ===== Idioma ===== */
function aplicarIdioma(nuevo) {
  idioma = nuevo; T = TEXTOS[idioma];
  document.documentElement.lang = idioma;
  document.title = T.app;
  document.querySelectorAll("[data-t]").forEach(n => { n.textContent = T[n.dataset.t]; });
  document.querySelectorAll(".view-tab").forEach(b => { b.textContent = T.vistas[b.dataset.vista]; });
  $("buscar").placeholder = T.buscar; $("buscar").setAttribute("aria-label", T.buscar);
  $("btnIdioma").textContent = T.nombreIdioma; $("btnIdioma").title = T.tipIdioma;
  $("lnkPortal").href = "../index.html#" + idioma;
  $("lnkPortal").title = T.portal; $("lnkPortal").setAttribute("aria-label", T.portal);
  $("toast").hidden = true;
  construirExtracto(); construirGuia(); render();
}

/* ===== Eventos ===== */
$("vConciliar").addEventListener("click", e => {
  const lote = e.target.closest("button[data-lote]");
  if (lote) { if (lote.dataset.lote !== juego.lote) empezarLote(lote.dataset.lote); return; }
  const doc = e.target.closest(".doc[data-i]");
  if (doc) clicDocumento(+doc.dataset.i);
});
$("btnNuevo").addEventListener("click", () => { mostrarVista("conciliar"); empezarLote(juego.lote); });

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {                                   // botón de pánico: instantáneo
    e.preventDefault();
    mostrarVista(vista === "conciliar" ? "extracto" : "conciliar");
  }
});

$("btnIdioma").addEventListener("click", () => aplicarIdioma(idioma === "es" ? "en" : "es"));
document.querySelectorAll(".view-tab").forEach(b => b.addEventListener("click", () => mostrarVista(b.dataset.vista)));
setInterval(() => { if (crono.inicio) pintarEstado(); }, 250);

/* ===== Arranque ===== */
const pedido = location.hash.slice(1).toLowerCase();
aplicarIdioma(TEXTOS[pedido] ? pedido : ((navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en"));
document.querySelectorAll(".view-tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.vista === vista)));
</script>
</body>
