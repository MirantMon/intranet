<html lang="es">
<head>
<title>Consolidación de partidas</title>

<meta property="og:description" content="Agrupación de importes equivalentes en la matriz de costes del ejercicio.">
<meta property="og:url" content="https://corporativo.recursosvidafacil.com/apps/consolidacion.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='2' fill='%23466b8c'/%3E%3Cpath d='M8 3.5l5 2.7-5 2.7-5-2.7z' fill='%23fff'/%3E%3Cpath d='M3 9l5 2.7L13 9' stroke='%23fff' stroke-width='1.2' fill='none'/%3E%3C/svg%3E">
<style>
  /* ===== Tokens: misma paleta sobria de la suite ===== */
  :root {
    --chrome: #f3f4f6;
    --chrome-2: #e8eaee;
    --line: #d5d8de;
    --bg: #eef0f3;
    --surface: #ffffff;
    --ink: #1f2328;
    --ink-2: #5a6270;
    --ink-3: #8a919c;
    --accent: #466b8c;
    --accent-soft: #e3ebf2;
    --ok: #2d6140;   --ok-bg: #e2efe6;
    --bad: #a3372a;  --bad-bg: #f7e3df;
    --wait: #50575f; --wait-bg: #eceef1;
    --font: Calibri, "Segoe UI", Arial, sans-serif;
    --celda: 92px;   /* tamaño de cada celda de la matriz */
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 13px/1.35 var(--font); overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100%; min-width: 0; }

  /* ===== Barra de título ===== */
  .titlebar { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--accent); color: #fff; white-space: nowrap; overflow: hidden; }
  .launcher { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 3px; color: #fff; flex: none; }
  .launcher:hover { background: rgba(255,255,255,.15); }
  .launcher:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
  .launcher svg { width: 14px; height: 14px; fill: currentColor; }
  .titlebar .doc { font-weight: 600; }
  .titlebar .sub { opacity: .8; font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .titlebar .spacer { flex: 1; }
  .titlebar .user { width: 22px; height: 22px; border-radius: 50%; background: #dfe7ee; color: var(--accent); display: grid; place-items: center; font-size: 10px; font-weight: 700; flex: none; }

  /* ===== Barra de herramientas ===== */
  .toolbar { display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--chrome); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
  .toolbar::-webkit-scrollbar { display: none; }
  .btn {
    flex: none; height: 30px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 3px; background: #fff; color: var(--ink); font: inherit; cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: var(--accent-soft); }
  .btn:disabled { color: var(--ink-3); background: #f7f8fa; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #3d5f7e; }
  .sep { flex: none; width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  .combo { flex: none; height: 28px; padding: 0 8px; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: #fff; border-radius: 3px; color: var(--ink-2); }
  .combo::after { content: "▾"; font-size: 10px; color: var(--ink-3); margin-left: 4px; }
  .combo b { color: var(--ink); font-weight: 600; }
  .buscar { flex: none; margin-left: auto; height: 28px; width: 200px; padding: 0 8px; border: 1px solid var(--line); border-radius: 3px; font: inherit; background: #fff; color: var(--ink); }

  /* ===== Pestañas de vista ===== */
  .views { display: flex; gap: 2px; padding: 0 12px; background: #fff; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .views::-webkit-scrollbar { display: none; }
  .view-tab { flex: none; padding: 8px 12px; border: 0; background: transparent; color: var(--ink-2); font: inherit; cursor: pointer; }
  .view-tab[aria-selected="true"] { color: var(--accent); font-weight: 700; box-shadow: inset 0 -2px 0 var(--accent); }
  .view-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ===== Contenido ===== */
  .main { flex: 1; min-height: 0; overflow: auto; }
  .page { padding: 16px 16px 32px; max-width: 1180px; }
  .page h2 { margin: 0; font-size: 18px; }
  .muted { color: var(--ink-3); font-size: 12px; margin: 2px 0 0; }
  .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .layout { display: grid; grid-template-columns: auto minmax(240px, 320px); gap: 16px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; min-width: 0; }
  .panel h3 { margin: 0 0 8px; font-size: 14px; }

  /* Estado del proceso (tipo sello) */
  .estado { display: inline-block; padding: 2px 10px; border-radius: 4px; border: 1.5px solid currentColor; font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .estado.ok { color: var(--ok); background: var(--ok-bg); }
  .estado.bad { color: var(--bad); background: var(--bad-bg); }
  .estado.run { color: var(--accent); background: var(--accent-soft); }

  /* ===== Matriz de costes (el tablero) ===== */
  .matriz-wrap { overflow-x: auto; }
  .matriz {
    display: grid; grid-template-columns: 96px repeat(4, var(--celda)) 88px; gap: 4px;
    font-variant-numeric: tabular-nums; touch-action: none; user-select: none; -webkit-user-select: none;
    width: max-content;
  }
  .matriz:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 4px; }
  .mh { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 6px 2px; }
  .rh { font-weight: 700; color: var(--ink-2); display: flex; align-items: center; font-size: 12px; padding-left: 2px; }
  .celda {
    height: var(--celda); border-radius: 4px; border: 1px solid var(--line); background: #f7f8fa;
    display: flex; align-items: flex-end; justify-content: flex-end; padding: 6px 8px;
    font-size: 17px; font-weight: 700; color: var(--ink-3);
  }
  .celda.v { border-color: transparent; }
  .celda small { font-size: 11px; font-weight: 400; margin-left: 2px; opacity: .8; }
  /* Escala secuencial de un solo tono (azul pizarra): más oscuro = importe mayor */
  .v1  { background: #eef3f8; color: #2b3e52; } .v2  { background: #dfe9f2; color: #2b3e52; }
  .v3  { background: #cddcea; color: #24384c; } .v4  { background: #b8cde0; color: #1f3346; }
  .v5  { background: #9fbad3; color: #1a2d40; } .v6  { background: #84a5c4; color: #142638; }
  .v7  { background: #6a8fb3; color: #fff; }    .v8  { background: #5479a0; color: #fff; }
  .v9  { background: #41658b; color: #fff; }    .v10 { background: #325273; color: #fff; }
  .v11 { background: #24405c; color: #fff; }    .v12 { background: #1a2f45; color: #fff; }
  .celda.v10, .celda.v11, .celda.v12 { font-size: 15px; }
  /* Destellos discretos: celda nueva y celda consolidada */
  @keyframes aparece { from { box-shadow: inset 0 0 0 2px #e2b84a; } to { box-shadow: inset 0 0 0 2px transparent; } }
  @keyframes funde { from { transform: scale(1.06); } to { transform: scale(1); } }
  .celda.nueva { animation: aparece .6s ease-out; }
  .celda.fusion { animation: funde .18s ease-out; }
  .tot { display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; border-radius: 4px; background: #f2f4f7; font-weight: 700; color: var(--ink-2); font-size: 13px; }
  .tot.grand { background: var(--accent-soft); color: var(--accent); }
  .tot.col { height: 34px; }

  .controles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; align-items: center; }
  .controles .lbl { font-size: 12px; color: var(--ink-2); margin-right: 4px; }
  .kpis { display: grid; gap: 10px; }
  .kpi .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 12px; color: var(--ink-3); }
  .kpi + .kpi { border-top: 1px solid #e6e8ec; padding-top: 10px; }

  /* Tablas de informe y guía */
  .tablewrap { overflow-x: auto; }
  table.list { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .list th, .list td { padding: 6px 8px; border-bottom: 1px solid #e6e8ec; text-align: left; white-space: nowrap; }
  .list th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 700; }
  .list td.n, .list th.n { text-align: right; }
  .list td.wrap { white-space: normal; min-width: 260px; }
  .list tr.sum td { font-weight: 700; border-top: 1px solid var(--line); }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: 11px; line-height: 15px; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.wait { background: var(--wait-bg); color: var(--wait); }
  .rkpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 14px 0; }
  .rkpis .kpi { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
  .rkpis .kpi + .kpi { border-top: 1px solid var(--line); padding-top: 10px; }

  /* ===== Barra de estado ===== */
  .status { display: flex; align-items: center; gap: 18px; padding: 3px 12px; padding-bottom: calc(3px + env(safe-area-inset-bottom, 0px)); background: var(--chrome); border-top: 1px solid var(--line); color: var(--ink-2); font-size: 12px; white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
  .status .spacer { flex: 1; }
  #btnIdioma { border: 0; background: transparent; color: inherit; font: inherit; padding: 1px 4px; border-radius: 2px; cursor: pointer; }
  #btnIdioma:hover { background: var(--chrome-2); }
  #btnIdioma:focus-visible { outline: 2px solid var(--accent); }

  .toast { position: fixed; right: 16px; bottom: 44px; max-width: calc(100% - 32px); z-index: 60; background: #fff; color: var(--ink); border: 1px solid var(--line); border-left: 3px solid var(--accent); box-shadow: 0 2px 8px rgba(20, 30, 45, .15); padding: 8px 12px; }
  .toast.ok { border-left-color: var(--ok); }
  .toast.bad { border-left-color: var(--bad); }

  @media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 560px) {
    :root { --celda: 62px; }
    .matriz { grid-template-columns: 58px repeat(4, var(--celda)); }
    .matriz .tot:not(.col), .matriz .mh.tc { display: none; }     /* en móvil se ocultan los totales por fila */
    .matriz .tot.grand { display: none; }
    .celda { font-size: 14px; padding: 4px 5px; }
    .celda small { display: none; }
    .celda.v10, .celda.v11, .celda.v12 { font-size: 12px; }
    .rh { font-size: 11px; }
    .titlebar .sub, .combo, .buscar, .toolbar .sep { display: none; }
    .rkpis { grid-template-columns: minmax(0, 1fr); }
    .status { gap: 10px; }
    .status .opt { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .celda.nueva, .celda.fusion { animation: none; } }
</style>
</head>
<body>

  <header class="titlebar">

/* =====================================================================
   CONSTANTES
   ===================================================================== */

const OBJETIVO = 2048;             // partida que completa la consolidación
const PROB_CUATRO = 0.1;           // probabilidad de que la nueva partida sea de 4 k€ (si no, 2 k€)
const UMBRAL_DESLIZAR = 30;        // píxeles mínimos para que un gesto táctil cuente
const DURACION_TOAST = 4500;

// Formato español con separador de miles también en números de 4 cifras (2.048 en vez de 2048)

const TEXTOS = {

// Datos ficticios del Informe: [centro, responsable, presupuesto, real] en k€
const DATOS_INFORME = [
  ["CC-410", "L. Ferrer", 1840, 1395], ["CC-420", "M. Ortega", 960, 781], ["CC-430", "A. Soler", 2310, 1902],

const NOMBRES_CC = {
  es: ["Ingeniería", "Compras", "Obra y montaje", "Calidad", "Puesta en marcha", "Administración"],

/* =====================================================================
   LÓGICA DEL JUEGO (2048, solo estado)
   La matriz es un array de 16 números: 0 = vacío; si no, importe en k€
   ===================================================================== */
function matrizVacia() { return new Array(N * N).fill(0); }

// Coloca una partida nueva en un hueco libre al azar; devuelve su índice o -1
function nuevaPartida(m) {
  const libres = [];
  m.forEach((v, i) => { if (!v) libres.push(i); });
  if (!libres.length) return -1;
  const i = libres[Math.floor(Math.random() * libres.length)];
  m[i] = Math.random() < PROB_CUATRO ? 4 : 2;
  return i;
}

// Índices de cada línea, ordenados en el sentido del movimiento (el primero es el "destino")
function lineas(dir) {
  const res = [];
  for (let a = 0; a < N; a++) {
    const l = [];
    for (let b = 0; b < N; b++) {
      if (dir === "izq") l.push(a * N + b);
      if (dir === "der") l.push(a * N + (N - 1 - b));
      if (dir === "arr") l.push(b * N + a);
      if (dir === "aba") l.push((N - 1 - b) * N + a);
    }
    res.push(l);
  }
  return res;
}

// Mueve toda la matriz. Devuelve { movido, ganado, fusiones: [índices] }
function mover(m, dir) {
  let movido = false, ganado = 0;
  const fusiones = [];
  for (const l of lineas(dir)) {
    const valores = l.map(i => m[i]).filter(v => v);
    const salida = [];
    for (let k = 0; k < valores.length; k++) {
      if (k + 1 < valores.length && valores[k] === valores[k + 1]) {
        const suma = valores[k] * 2;                 // cada partida solo se consolida una vez por movimiento
        salida.push(suma); ganado += suma; fusiones.push(l[salida.length - 1]);
        k++;
      } else salida.push(valores[k]);
    }
    while (salida.length < N) salida.push(0);
    l.forEach((idx, k) => { if (m[idx] !== salida[k]) movido = true; m[idx] = salida[k]; });
  }
  return { movido, ganado, fusiones };
}

function quedanMovimientos(m) {
  for (let i = 0; i < N * N; i++) {
    if (!m[i]) return true;
    const x = i % N, y = (i / N) | 0;
    if (x < N - 1 && m[i] === m[i + 1]) return true;
    if (y < N - 1 && m[i] === m[i + N]) return true;
  }
  return false;
}

/* ===== Estado de la partida ===== */
let juego, historial, mejor = 0, ultimaNueva = -1, ultimasFusiones = [];
function nuevaConsolidacion() {
  const m = matrizVacia();
  nuevaPartida(m); nuevaPartida(m);
  juego = { m, importe: 0, movs: 0, alcanzado: false, bloqueado: false };
  historial = []; ultimaNueva = -1; ultimasFusiones = [];
  crono.ms = 0; crono.inicio = 0; crono.activo = false;
}

/* ===== Cronómetro por tramos (se pausa en las vistas seguras) ===== */
const crono = { ms: 0, inicio: 0, activo: false };
function arrancar() { if (crono.activo && !crono.inicio) crono.inicio = performance.now(); }
function parar() { if (crono.inicio) { crono.ms += performance.now() - crono.inicio; crono.inicio = 0; } }
function transcurrido() { return crono.ms + (crono.inicio ? performance.now() - crono.inicio : 0); }

/* =====================================================================
   ACCIONES Y RENDERIZADO
   ===================================================================== */
const $ = id => document.getElementById(id);
let idioma = "es", T = TEXTOS.es, vista = "matriz";

function consolidar(dir) {
  if (vista !== "matriz" || juego.bloqueado) return;
  const antes = JSON.stringify(juego);
  const r = mover(juego.m, dir);
  if (!r.movido) return;
  historial.push(antes);
  juego.importe += r.ganado; juego.movs++;
  ultimasFusiones = r.fusiones;
  ultimaNueva = nuevaPartida(juego.m);
  mejor = Math.max(mejor, juego.importe);
  if (!crono.activo) { crono.activo = true; arrancar(); }
  render();
  if (!juego.alcanzado && Math.max(...juego.m) >= OBJETIVO) { juego.alcanzado = true; toast(T.victoria, "ok"); render(); }
  if (!quedanMovimientos(juego.m)) { juego.bloqueado = true; parar(); crono.activo = false; toast(T.bloqueo, "bad"); render(); }
}

function deshacer() {
  if (!historial.length || vista !== "matriz") return;
  juego = JSON.parse(historial.pop());
  ultimaNueva = -1; ultimasFusiones = [];
  if (!juego.bloqueado && juego.movs > 0) { crono.activo = true; arrancar(); }
  $("toast").hidden = true;
  render();
}

function nivel(v) { return v ? Math.min(12, Math.log2(v)) : 0; }

function render() {
  const m = juego.m;
  const h = [`<div class="mh"></div>`];
  T.columnas.forEach(c => h.push(`<div class="mh">${c}</div>`));
  h.push(`<div class="mh tc">${T.totalFila}</div>`);
  for (let y = 0; y < N; y++) {
    h.push(`<div class="rh">${T.filas[y]}</div>`);
    let totalFila = 0;
    for (let x = 0; x < N; x++) {
      const i = y * N + x, v = m[i];
      totalFila += v;
      const cls = ["celda"];
      if (v) cls.push("v", "v" + nivel(v));
      if (i === ultimaNueva) cls.push("nueva");
      if (ultimasFusiones.includes(i)) cls.push("fusion");
      h.push(`<div class="${cls.join(" ")}" data-i="${i}">${v ? T.kCorto(v) : "—"}</div>`);
    }
    h.push(`<div class="tot">${T.k(totalFila)}</div>`);
  }
  // Fila de totales por trimestre
  h.push(`<div class="rh">${T.totalCol}</div>`);
  let total = 0;
  for (let x = 0; x < N; x++) {
    let t = 0; for (let y = 0; y < N; y++) t += m[y * N + x];
    total += t;
    h.push(`<div class="tot col">${T.k(t)}</div>`);
  }
  h.push(`<div class="tot col grand">${T.k(total)}</div>`);

  const estado = juego.bloqueado ? `<span class="estado bad">${T.estados.bloq}</span>`
    : juego.alcanzado ? `<span class="estado ok">${T.estados.ok}</span>`
    : `<span class="estado run">${T.estados.curso}</span>`;
  const flecha = { izq: "M10 4L6 8l4 4", arr: "M4 10l4-4 4 4", der: "M6 4l4 4-4 4", aba: "M4 6l4 4 4-4" };
  const botones = ["izq", "arr", "aba", "der"].map(d =>
    `<button class="btn" type="button" data-dir="${d}"><svg viewBox="0 0 16 16"><path d="${flecha[d]}"/></svg>${T.dirs[d]}</button>`).join("");

  $("vMatriz").innerHTML = `
    <div class="head"><div><h2>${T.titulo}</h2><p class="muted">${T.subtitulo}</p></div>${estado}</div>
    <div class="layout">
      <section class="panel"><div class="matriz-wrap"><div class="matriz" id="matriz" tabindex="0" aria-label="${T.titulo}">${h.join("")}</div></div>
        <div class="controles"><span class="lbl">${T.consolidar}</span>${botones}</div></section>
      <aside class="panel kpis">
        <div class="kpi"><div class="v">${T.k(juego.importe)}</div><div class="l">${T.kpis[0]}</div></div>
        <div class="kpi"><div class="v">${T.k(Math.max(...m))}</div><div class="l">${T.kpis[1]}</div></div>
        <div class="kpi"><div class="v">${T.k(mejor)}</div><div class="l">${T.kpis[2]}</div></div>
      </aside>
    </div>`;
  $("btnDeshacer").disabled = !historial.length;
  pintarEstado();
}

function pintarEstado() {
  $("stImporte").textContent = T.importe(T.k(juego.importe));
  $("stMovs").textContent = T.movs(juego.movs);
  const s = Math.floor(transcurrido() / 1000);
  $("stTiempo").textContent = T.tiempo + String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}

let temporizadorToast = 0;
function toast(texto, tono) {
  $("toast").textContent = texto;
  $("toast").className = "toast" + (tono ? " " + tono : "");
  $("toast").hidden = false;
  clearTimeout(temporizadorToast);
  temporizadorToast = setTimeout(() => { $("toast").hidden = true; }, DURACION_TOAST);
}

/* ===== Vistas seguras ===== */
function construirInforme() {
  const I = T.informe;
  const pres = DATOS_INFORME.reduce((s, d) => s + d[2], 0), real = DATOS_INFORME.reduce((s, d) => s + d[3], 0);
  const pct = (r, p) => (r / p * 100 - 75);    // desviación frente al 75 % esperado a cierre de T3
  const fmtPct = v => (v > 0 ? "+" : "") + v.toFixed(1).replace(".", T.locale === "es-ES" ? "," : ".") + " %";
  const est = v => Math.abs(v) <= 3 ? "ok" : v > 3 ? "bad" : "wait";
  const filas = DATOS_INFORME.map(([cc, resp, p, r], k) => {
    const d = pct(r, p);
    return `<tr><td>${cc} · ${NOMBRES_CC[idioma][k]}</td><td>${resp}</td><td class="n">${T.k(p)}</td><td class="n">${T.k(r)}</td>
      <td class="n">${fmtPct(d)}</td><td><span class="pill ${est(d)}">${I.estados[est(d)]}</span></td></tr>`;
  }).join("");
  $("vInforme").innerHTML = `<h2>${I.titulo}</h2><p class="muted">${I.sub}</p>
    <div class="rkpis">
      <div class="kpi"><div class="v">${T.k(pres)}</div><div class="l">${I.kpis[0]}</div></div>
      <div class="kpi"><div class="v">${T.k(real)}</div><div class="l">${I.kpis[1]}</div></div>
      <div class="kpi"><div class="v">${fmtPct(pct(real, pres))}</div><div class="l">${I.kpis[2]}</div></div>
    </div>
    <section class="panel"><div class="tablewrap"><table class="list">
      <thead><tr>${I.cab.map((c, k) => `<th class="${k >= 2 && k <= 4 ? "n" : ""}">${c}</th>`).join("")}</tr></thead>
      <tbody>${filas}<tr class="sum"><td>${I.total}</td><td></td><td class="n">${T.k(pres)}</td><td class="n">${T.k(real)}</td><td class="n">${fmtPct(pct(real, pres))}</td><td></td></tr></tbody>
    </table></div></section>`;
}

function construirGuia() {
  const G = T.guia;
  $("vGuia").innerHTML = `<h2>${G.titulo}</h2><p class="muted">${G.sub}</p>
    <section class="panel" style="margin-top:14px"><div class="tablewrap"><table class="list">
      <thead><tr>${G.cab.map(c => `<th>${c}</th>`).join("")}</tr></thead>
      <tbody>${G.filas.map(f => `<tr><td><b>${f[0]}</b></td><td>${f[1]}</td><td class="wrap">${f[2]}</td></tr>`).join("")}</tbody>
    </table></div></section>`;
}

function mostrarVista(v) {
  if (v === vista) return;
  if (vista === "matriz") parar();
  vista = v;
  $("vMatriz").hidden = v !== "matriz";
  $("vInforme").hidden = v !== "informe";
  $("vGuia").hidden = v !== "guia";
  $("toast").hidden = true;
  $("main").scrollTo(0, 0);
  if (v === "matriz" && crono.activo) arrancar();
  document.querySelectorAll(".view-tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.vista === v)));
  pintarEstado();
}

/* ===== Idioma ===== */
function aplicarIdioma(nuevo) {
  idioma = nuevo; T = TEXTOS[idioma];
  document.documentElement.lang = idioma;
  document.title = T.app;
  document.querySelectorAll("[data-t]").forEach(n => { n.textContent = T[n.dataset.t]; });
  document.querySelectorAll(".view-tab").forEach(b => { b.textContent = T.vistas[b.dataset.vista]; });
  $("buscar").placeholder = T.buscar; $("buscar").setAttribute("aria-label", T.buscar);
  $("btnIdioma").textContent = T.nombreIdioma; $("btnIdioma").title = T.tipIdioma;
  $("lnkPortal").href = "../index.html#" + idioma;
  $("lnkPortal").title = T.portal; $("lnkPortal").setAttribute("aria-label", T.portal);
  $("toast").hidden = true;
  ultimaNueva = -1; ultimasFusiones = [];
  construirInforme(); construirGuia(); render();
}

/* =====================================================================
   ENTRADA: teclado, botones y gestos táctiles
   ===================================================================== */
const TECLAS = { ArrowLeft: "izq", ArrowUp: "arr", ArrowRight: "der", ArrowDown: "aba", a: "izq", w: "arr", d: "der", s: "aba" };

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {                                  // botón de pánico: instantáneo
    e.preventDefault();
    mostrarVista(vista === "matriz" ? "informe" : "matriz");
    return;
  }
  if (vista !== "matriz" || e.target.closest("input")) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); deshacer(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const dir = TECLAS[e.key] || TECLAS[e.key.toLowerCase()];
  if (dir) { e.preventDefault(); consolidar(dir); }
});

$("vMatriz").addEventListener("click", e => {
  const b = e.target.closest("button[data-dir]");
  if (b) consolidar(b.dataset.dir);
});

// Deslizar el dedo (o arrastrar el ratón) sobre la matriz
let inicioGesto = null;
$("vMatriz").addEventListener("pointerdown", e => {
  if (e.target.closest("#matriz")) inicioGesto = { x: e.clientX, y: e.clientY, id: e.pointerId };
});
document.addEventListener("pointerup", e => {
  if (!inicioGesto || e.pointerId !== inicioGesto.id) return;
  const dx = e.clientX - inicioGesto.x, dy = e.clientY - inicioGesto.y;
  inicioGesto = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < UMBRAL_DESLIZAR) return;
  consolidar(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "der" : "izq") : (dy > 0 ? "aba" : "arr"));
});
document.addEventListener("pointercancel", () => { inicioGesto = null; });

$("btnNuevo").addEventListener("click", () => { mostrarVista("matriz"); nuevaConsolidacion(); $("toast").hidden = true; render(); });
$("btnDeshacer").addEventListener("click", deshacer);
$("btnIdioma").addEventListener("click", () => aplicarIdioma(idioma === "es" ? "en" : "es"));
document.querySelectorAll(".view-tab").forEach(b => b.addEventListener("click", () => mostrarVista(b.dataset.vista)));
setInterval(() => { if (crono.inicio) pintarEstado(); }, 250);

/* ===== Arranque ===== */
nuevaConsolidacion();
const pedido = location.hash.slice(1).toLowerCase();
aplicarIdioma(TEXTOS[pedido] ? pedido : ((navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en"));
document.querySelectorAll(".view-tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.vista === vista)));
</script>
</body>
